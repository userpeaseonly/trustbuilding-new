{% load static %}
{% load i18n %}

<!-- Mobile Header -->
<header class="lg:hidden flex items-center justify-between px-6 py-4 border-b shadow-md" style="background: linear-gradient(135deg, #001034 0%, #001a4d 100%); border-bottom: 1px solid; border-image: linear-gradient(90deg, rgba(0, 225, 255, 0.3) 0%, rgba(0, 225, 255, 0.1) 100%) 1;">
    <button @click="sidebarOpen = true" class="text-white hover:opacity-80 transition-all duration-200">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>
    <div class="flex items-center gap-3">
        <img src="{% static 'images/Imaan_logo.svg' %}" alt="Imaan" class="h-10">
    </div>
    <div class="w-6"></div>
</header>
