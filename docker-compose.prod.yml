services:
  web:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: trustbuilding_web_prod
    command: /start
    volumes:
      - static_files:/app/static
      - media_files:/app/media
    ports:
      - 8010:8000
    env_file:
      - ./env/.production
    depends_on:
      - db

  db:
    image: postgres:18
    volumes:
      - trustbuilding_prod_data:/var/lib/postgresql/18/data/
    env_file:
      - ./env/.production

volumes:
  trustbuilding_prod_data:
  static_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/trustbuilding/static
  media_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/www/trustbuilding/media

