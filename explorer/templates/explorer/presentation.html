      const isHov = this.hoveredFloor && this.hoveredFloor.floor_number === fl.floor_number;
      const litPattern = ((fl.floor_number * 7 + idx * 3) % 10) < 7;
      if (!isHov && !litPattern && !isNight) return 'display: none;';
      const bg = isHov
        ? 'rgba(52, 211, 153, 0.62)'
        : (isNight
            ? (litPattern ? 'rgba(253, 224, 130, 0.68)' : 'rgba(30, 58, 138, 0.25)')
            : 'rgba(251, 191, 36, 0.34)');
      const shadow = isHov
        ? '0 0 10px rgba(16, 185, 129, 0.7)'
        : (isNight && litPattern ? '0 0 8px rgba(251, 191, 36, 0.52)' : 'none');
      return `left:${x}%; top:${y}%; width:${w}%; height:${h}%; background:${bg}; box-shadow:${shadow}; mix-blend-mode: screen;`;
    },

    openFloor(floorNum) {
      const update = () => {
        this.currentFloorNumber = floorNum;
        this.stage = 'floor';
        this.hoveredFloor = null;
      };
      this.runStageTransition(update, 'floor-stage-heading');
    },

    switchFloor(floorNum) {
      const update = () => {
        this.currentFloorNumber = floorNum;
      };
      this.runStageTransition(update, 'floor-stage-heading');
    },

    backToBuilding() {
      const update = () => {
        this.stage = 'building';
        this.hoveredHotspotId = null;
      };
      this.runStageTransition(update, 'building-stage-heading');
    },

    runStageTransition(updateFn, focusId, afterFn) {
      if (!document.startViewTransition) {
        updateFn();
        this.$nextTick(() => {
          document.getElementById(focusId)?.focus();
          if (afterFn) requestAnimationFrame(afterFn);
        });
        return;
      }
      const transition = document.startViewTransition(() => updateFn());
      transition.finished.finally(() => {
        this.$nextTick(() => {
          document.getElementById(focusId)?.focus();
          if (afterFn) requestAnimationFrame(afterFn);
        });
      });
    },

    get hoveredHotspot() {
      if (!this.hoveredHotspotId) return null;
      return (this.currentFloor?.hotspots || []).find(h => h.id === this.hoveredHotspotId) || null;
    },

    get hoveredApt() {
      const hs = this.hoveredHotspot;
      if (!hs || !hs.apartment_id) return null;
      return this.getApt(hs.apartment_id);
    },

    get floorSpotlightPathD() {
      const hs = this.hoveredHotspot;
      if (!hs || !hs.polygon_points || hs.polygon_points.length < 3) return '';
      const inner = hs.polygon_points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p[0]} ${p[1]}`).join(' ') + ' Z';
      return `M 0 0 L 100 0 L 100 100 L 0 100 Z ${inner}`;
    },

    getApt(aptId) {
      return (this.payload.apartments || {})[aptId] || null;
    },

    setFilterMode(mode) {
      this.filterMode = mode;
    },

    matchesFilter(apt) {
      if (!apt) return false;
      if (this.filterMode === 'available') return apt.status === 'AVAILABLE';
      if (this.filterMode === '1r') return apt.living_room_count === 1;
      if (this.filterMode === '2r') return apt.living_room_count >= 2;
      return true;
    },

    filteredFloorApts() {
      return (this.currentFloor?.apartments || []).filter(a => this.matchesFilter(a));
    },

    findHotspotForApt(aptId) {
      return (this.currentFloor?.hotspots || []).find(h => h.apartment_id === aptId) || null;
    },

    isAptHovered(aptId) {
      if (!this.hoveredHotspotId || !aptId) return false;
      const hs = this.findHotspotForApt(aptId);
      return Boolean(hs && hs.id === this.hoveredHotspotId);
    },

    highlightApt(aptId) {
      if (!aptId) {
        this.hoverHotspot(null);
        return;
      }
      const hs = this.findHotspotForApt(aptId);
      this.hoverHotspot(hs ? hs.id : null);
    },

    hoverHotspot(hsId) {
      this.hoveredHotspotId = hsId || null;
    },

    hotspotOpacity(hs) {
      if (!hs.apartment_id) return 0.4;
      const apt = this.getApt(hs.apartment_id);
      return this.matchesFilter(apt) ? 1.0 : 0.14;
    },

    hotspotFill(hs) {
      const hover = this.hoveredHotspotId === hs.id;
      const apt = hs.apartment_id ? this.getApt(hs.apartment_id) : null;
      if (!apt) return hover ? 'rgba(100, 116, 139, 0.35)' : 'rgba(100, 116, 139, 0.16)';
      if (apt.status === 'AVAILABLE') return hover ? 'rgba(16, 185, 129, 0.38)' : 'rgba(16, 185, 129, 0.24)';
      if (apt.status === 'RESERVED') return hover ? 'rgba(245, 158, 11, 0.42)' : 'rgba(245, 158, 11, 0.25)';
      return hover ? 'rgba(225, 29, 72, 0.30)' : 'rgba(225, 29, 72, 0.20)';
    },

    isNarrowHotspot(hs) {
      const pts = hs?.polygon_points || [];
      if (pts.length < 3) return false;
      let minX = 100, maxX = 0;
      for (const p of pts) {
        if (p[0] < minX) minX = p[0];
        if (p[0] > maxX) maxX = p[0];
      }
      if ((maxX - minX) < 18.8) return true;
      const others = (this.currentFloor?.hotspots || []).filter(
        o => o.id !== hs.id && o.apartment_id && this.getApt(o.apartment_id)
      );
      return others.some(
        o => Math.abs((o.label_y || 0) - (hs.label_y || 0)) < 16 &&
             Math.abs((o.label_x || 0) - (hs.label_x || 0)) < 18.5
      );
    },

    paidRingStroke(pct) {
      const val = Number(pct || 0);
      if (val >= 75) return '#10b981';
      if (val >= 25) return '#f59e0b';
      return '#f43f5e';
    },

    paidRingOffset(pct) {
      const raw = Math.max(0, Math.min(100, Number(pct || 0)));
      const vis = raw > 0 ? Math.max(5, raw) : 0;
      return (113.1 * (1 - vis / 100)).toFixed(2);
    },

    paidBarColorClass(pct) {
      const val = Number(pct || 0);
      if (val >= 75) return 'bg-emerald-500';
      if (val >= 25) return 'bg-amber-500';
      return 'bg-rose-500';
    },

    aptHoverRingClass(status) {
      if (status === 'AVAILABLE') return 'ring-2 ring-emerald-500/50 border-emerald-500 shadow-sm';
      if (status === 'RESERVED') return 'ring-2 ring-amber-500/50 border-amber-500 shadow-sm';
      return 'ring-2 ring-rose-400/50 border-rose-400 shadow-sm';
    },

    get prevFloorApt() {
      const list = this.currentFloor?.apartments || [];
      if (!this.selectedApt || list.length < 2) return null;
      const idx = list.findIndex(a => a.id === this.selectedApt.id);
      if (idx < 0) return null;
      return list[(idx - 1 + list.length) % list.length];
    },

    get nextFloorApt() {
      const list = this.currentFloor?.apartments || [];
      if (!this.selectedApt || list.length < 2) return null;
      const idx = list.findIndex(a => a.id === this.selectedApt.id);
      if (idx < 0) return null;
      return list[(idx + 1) % list.length];
    },

    stepFloorApt(delta) {
      const target = delta < 0 ? this.prevFloorApt : this.nextFloorApt;
      if (!target) return;
      this.selectedApt = target;
      this.selectedHotspot = this.findHotspotForApt(target.id);
    },

    hotspotStroke(hs) {
      const apt = hs.apartment_id ? this.getApt(hs.apartment_id) : null;
      if (!apt) return '#64748b';
      if (apt.status === 'AVAILABLE') return '#059669';
      if (apt.status === 'RESERVED') return '#d97706';
      return '#be123c';
    },

    aptPinClass(status) {
      if (status === 'AVAILABLE') return 'border-l-emerald-500 hover:border-emerald-400';
      if (status === 'RESERVED') return 'border-l-amber-500 hover:border-amber-400';
      return 'border-l-rose-500 hover:border-rose-400';
    },

    aptPinHoverClass(status) {
      if (status === 'AVAILABLE') return 'ring-2 ring-emerald-500/50 shadow-lg';
      if (status === 'RESERVED') return 'ring-2 ring-amber-500/50 shadow-lg';
      return 'ring-2 ring-rose-500/50 shadow-lg';
    },

    aptCardClass(status) {
      if (status === 'AVAILABLE') {
        return '{% if is_public %}bg-emerald-950/40 border-emerald-500/60 hover:border-emerald-400 text-white shadow-2xs{% else %}bg-emerald-50/55 border-emerald-300 hover:border-emerald-500 hover:bg-emerald-50/80 text-slate-900 shadow-2xs{% endif %}';
      }
      if (status === 'RESERVED') {
        return '{% if is_public %}bg-amber-950/35 border-amber-500/50 hover:border-amber-400 text-white{% else %}bg-amber-50/55 border-amber-300 hover:border-amber-500 text-slate-900{% endif %}';
      }
      return '{% if is_public %}bg-rose-950/35 border-rose-500/45 hover:border-rose-400 text-slate-100{% else %}bg-rose-50/75 border-rose-200 hover:border-rose-400 text-slate-800 shadow-2xs{% endif %}';
    },

    statusBadgeClass(status) {
      if (status === 'AVAILABLE') return 'bg-emerald-100 text-emerald-800 border border-emerald-300';
      if (status === 'RESERVED') return 'bg-amber-100 text-amber-800 border border-amber-300';
      return 'bg-rose-100 text-rose-800 border border-rose-200';
    },

    aptAccessibleLabel(apt) {
      const buyer = apt.buyer_name ? `, {% trans "Sold to:" %} ${apt.buyer_name}` : '';
      return `{% trans "Apt" %} ${apt.apartment_number}, ${apt.living_room_count} {% trans "rooms" %}, ${apt.total_area} m², ${apt.status_label}${buyer}`;
    },

    openAptDialog(aptId, hs) {
      const apt = this.getApt(aptId);
      if (!apt) return;
      this.selectedApt = apt;
      this.selectedHotspot = hs || this.findHotspotForApt(aptId);
      const dialog = document.getElementById('apt-detail-dialog');
      if (dialog && !dialog.open) {
        dialog.showModal();
      }
    },

    closeAptDialog() {
      const dialog = document.getElementById('apt-detail-dialog');
      if (dialog && dialog.open) {
        dialog.close();
      }
    },
  };
}
</script>
