{% load i18n %}
<div class="group relative p-2.5 bg-white border border-slate-200 rounded-xl transition-all duration-200 cursor-pointer shadow-sm hover:shadow-md overflow-hidden text-left
    {% if apt.status == 'AVAILABLE' %}hover:border-emerald-400
    {% elif apt.status == 'RESERVED' %}hover:border-amber-400
    {% else %}hover:border-rose-400{% endif %}"
    hx-get="{% url 'building:apartment_update' pk=apt.pk %}"
    hx-target="#modal-container"
    hx-swap="innerHTML">
    
    <div class="flex justify-between items-start mt-1">
        <div class="text-[13px] font-extrabold text-slate-900">{% trans "Apt" %} {{ apt.apartment_number }}</div>
        <div class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded
                    {% if apt.status == 'AVAILABLE' %}bg-emerald-50 text-emerald-700
                    {% elif apt.status == 'RESERVED' %}bg-amber-50 text-amber-700
                    {% else %}bg-rose-50 text-rose-700{% endif %}">
            {{ apt.get_status_display|truncatechars:5 }}
        </div>
    </div>
    
    <div class="mt-2.5 space-y-1.5">
        <div class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-600">
            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
            </svg>
            {{ apt.total_area }} m²
        </div>
        <div class="flex items-center gap-1.5 text-[11px] font-semibold text-slate-600">
            <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 13.5V3.75m0 9.75a1.5 1.5 0 010 3m0-3a1.5 1.5 0 000 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 010 3m0-3a1.5 1.5 0 000 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 010 3m0-3a1.5 1.5 0 000 3m0 9.75V10.5" />
            </svg>
            {{ apt.living_room_count }} {% trans "Rooms" %}
        </div>
    </div>

    <!-- Action Buttons on Hover -->
    {% if apt.status == 'AVAILABLE' %}
    <div class="absolute inset-0 bg-white/90 backdrop-blur-[2px] flex items-center justify-center p-2 opacity-0 group-hover:opacity-100 transition-opacity z-10">
        <a href="{% url 'contract:create' %}?apartment={{ apt.pk }}" onclick="event.stopPropagation()" class="flex-1 text-center text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700 py-1.5 rounded-md shadow-sm transition-colors">
            + Contract
        </a>
    </div>
    {% endif %}
</div>
