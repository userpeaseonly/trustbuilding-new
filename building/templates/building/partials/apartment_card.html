{% load i18n %}
<div class="relative cursor-pointer transition-transform hover:scale-105"
     hx-get="{% url 'building:apartment_update' pk=apt.pk %}"
     hx-target="#modal-container"
     hx-swap="innerHTML">
    
    <div class="border rounded-md p-2 h-full flex flex-col justify-between
        {% if apt.status == 'AVAILABLE' %}bg-green-900/20 border-green-700/50 hover:border-green-500
        {% elif apt.status == 'RESERVED' %}bg-yellow-900/20 border-yellow-700/50 hover:border-yellow-500
        {% elif apt.status == 'SOLD' %}bg-red-900/20 border-red-700/50 hover:border-red-500
        {% else %}bg-gray-800 border-gray-700 hover:border-blue-500{% endif %}">
        
        <div class="flex justify-between items-start">
            <span class="text-xs font-bold text-white">{{ apt.apartment_number }}</span>
            <span class="text-[0.65rem] text-gray-400">{{ apt.total_area }} m&sup2;</span>
        </div>
        
        <div class="mt-2 flex justify-between items-end">
            <span class="text-[0.65rem] text-gray-500">{{ apt.living_room_count }} {% trans "rooms" %}</span>
            {% if apt.plan_image %}
            <svg class="w-3 h-3 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            {% endif %}
        </div>
    </div>
</div>
