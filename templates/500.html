{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — {% trans "Server Error" %} | TrustBuilding</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center px-4 text-white">
    <div class="text-center max-w-md">
        <div class="mb-6">
            <span class="text-8xl font-extrabold text-red-500">500</span>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">{% trans "Server Error" %}</h1>
        <p class="text-gray-400 mb-8">
            {% trans "Something went wrong on our end. Please try again later or contact your administrator if the problem persists." %}
        </p>
        <a href="{% url 'dashboard:home' %}"
           class="inline-flex items-center px-5 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-500 transition-colors">
            &larr; {% trans "Back to Dashboard" %}
        </a>
    </div>
</body>
</html>
