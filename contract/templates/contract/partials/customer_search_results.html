{% load i18n %}
<div class="space-y-1">
    {% for c in customers %}
    <div @click="selectedCustomerId = '{{ c.pk }}'; selectedCustomerName = '{{ c.full_name|default:c.phone_number|escapejs }} ({{ c.phone_number }})'; openCustomerSearch = false" 
         class="p-3 bg-white hover:bg-slate-50 border-slate-200 hover:border-indigo-300 shadow-sm rounded-lg cursor-pointer transition border border-slate-300 flex justify-between items-center text-xs group">
        <div>
            <div class="font-bold text-slate-900 group-hover:text-indigo-700">{{ c.full_name|default:"Customer" }}</div>
            <div class="text-[11px] text-slate-500 font-mono mt-0.5">{{ c.phone_number }}</div>
        </div>
        <div class="text-right">
            <span class="text-[10px] text-slate-500 font-mono block bg-slate-100 px-2 py-0.5 rounded">{{ c.passport_jshshr|default:c.passport_series|default:"No PINFL" }}</span>
            <span class="text-[11px] text-indigo-600 font-bold mt-1 block">{% trans "Select" %} &rarr;</span>
        </div>
    </div>
    {% empty %}
    <div class="p-4 text-center text-xs text-slate-500 italic bg-slate-50 rounded-lg">
        {% trans "No customers found. Click 'Register New Customer' above to add them." %}
    </div>
    {% endfor %}
</div>
