# =========================
# Upstream (keepalive pool)
# =========================
# Reuses TCP connections to Gunicorn instead of opening a new one per request.
# keepalive = max idle connections kept open per worker process.
upstream gunicorn {
    server 127.0.0.1:8010;
    keepalive 32;
}

# =========================
# HTTP → HTTPS
# =========================
server {
    if ($host = lms.imaan-school.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name lms.imaan-school.uz 91.99.16.209;

    access_log /var/log/nginx/imaan.access.log;
    error_log  /var/log/nginx/imaan.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }


}

# =========================
# HTTPS (main server)
# =========================
server {
    listen 443 ssl http2;
    server_name lms.imaan-school.uz 91.99.16.209;

    # SSL (certbot will manage these)
    ssl_certificate /etc/letsencrypt/live/lms.imaan-school.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lms.imaan-school.uz/privkey.pem; # managed by Certbot

    # Security / SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Upload limits
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/imaan.access.log;
    error_log  /var/log/nginx/imaan.error.log;

    # =========================
    # Gzip
    # =========================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/html
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # =========================
    # Security Headers
    # =========================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # =========================
    # Static files
    # =========================
    location /static/ {
        alias /var/www/imaan/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =========================
    # Media files
    # =========================
    location /media/ {
        alias /var/www/imaan/media/;
        expires 7d;
        access_log off;
    }


    # =========================
    # Django / Gunicorn
    # =========================
    location / {
        proxy_pass http://gunicorn;   # uses the upstream keepalive pool
        proxy_redirect off;

        # HTTP/1.1 + clear Connection header are required for upstream keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;

        # Response buffering — nginx absorbs the full response from Gunicorn
        # before sending to the client, freeing the Gunicorn worker sooner.
        proxy_buffering on;
        proxy_buffer_size        8k;
        proxy_buffers           16 16k;
        proxy_busy_buffers_size 32k;

        # Timeouts (important for uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        send_timeout 120s;
    }

}